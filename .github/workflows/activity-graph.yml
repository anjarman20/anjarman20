name: Update Activity Graph

on:
  schedule:
    - cron: '30 17 * * *'  # 00:30 WIB, after day rollover
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/workflows/activity_graph.py

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          rm -f assets/activity-graph.svg assets/activity-graph-heatmap.svg
          git add assets/
          if ! git diff --quiet --cached; then
            git commit -m 'Update activity graph [skip ci]'
            git push
          else
            echo 'No changes to commit'
          fi
